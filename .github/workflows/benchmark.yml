name: NanaSQLite Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline tag or commit to run on the same runner (empty: HEAD^)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  # ============================================
  # Should-Run Check - Determines if benchmarks needed
  # ============================================
  should-run:
    name: Check if Benchmark needed
    runs-on: ubuntu-latest
    outputs:
      run_benchmark: ${{ steps.check.outputs.run_benchmark }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check changed files
      id: check
      run: |
        # For workflow_dispatch: always run
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "run_benchmark=true" >> $GITHUB_OUTPUT
          echo "workflow_dispatch - Benchmark required"
          exit 0
        fi

        # For main branch: always run
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "run_benchmark=true" >> $GITHUB_OUTPUT
          echo "Main branch - Benchmark required"
          exit 0
        fi

        # For PRs: check source, tests and benchmark configuration
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
        fi

        CHANGED_FILES=$(git diff --name-only $BASE_SHA ${{ github.sha }} 2>/dev/null || echo "")
        
        # Check files that can change behavior or measurement
        if echo "$CHANGED_FILES" | grep -qE '^(src/|tests/|scripts/benchmark_operational\.py$|\.github/workflows/benchmark\.yml$|pyproject\.toml$)'; then
          echo "run_benchmark=true" >> $GITHUB_OUTPUT
          echo "Source or benchmark configuration changed - Benchmark required"
        else
          echo "run_benchmark=false" >> $GITHUB_OUTPUT
          echo "No relevant changes - Benchmark skipped"
        fi
  paired-benchmark:
    name: Same-run baseline comparison (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: should-run
    if: needs.should-run.outputs.run_benchmark == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
        exclude:
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install one shared dependency environment
        run: python -m pip install -e . orjson cryptography
      - name: Resolve immutable baseline
        shell: python
        env:
          BENCH_EVENT: ${{ github.event_name }}
          BENCH_PR_BASE: ${{ github.event.pull_request.base.sha }}
          BENCH_PUSH_BASE: ${{ github.event.before }}
          BENCH_MANUAL_BASE: ${{ inputs.baseline_ref }}
        run: |
          import os, subprocess
          event = os.environ['BENCH_EVENT']
          if event == 'pull_request':
              ref = os.environ['BENCH_PR_BASE']
          elif event == 'push':
              ref = os.environ['BENCH_PUSH_BASE']
          else:
              ref = os.environ.get('BENCH_MANUAL_BASE') or 'HEAD^'
          if not ref or set(ref) == {'0'}:
              ref = 'HEAD^'
          sha = subprocess.check_output(['git', 'rev-parse', '--verify', '--end-of-options', ref + '^{commit}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('BENCH_BASELINE=' + sha + '\n')
      - name: Run baseline and candidate in alternating order
        shell: bash
        run: |
          python -m pip freeze > paired-environment.txt
          python scripts/benchmark_operational.py --baseline-ref "$BENCH_BASELINE" --repeats 7 --db-dir "$RUNNER_TEMP/paired-db" --output paired.json --markdown paired.md
          cat paired.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload paired measurements and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            paired.json
            paired.md
            paired-environment.txt
          if-no-files-found: error
          retention-days: 30

  benchmark:
    needs: should-run
    if: needs.should-run.outputs.run_benchmark == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          # Windows: only 3.13
          - os: windows-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Setup Windows temp directory
      if: runner.os == 'Windows'
      shell: powershell
      run: New-Item -ItemType Directory -Force -Path D:\temp

    - name: Install dependencies
      run: |
        uv pip install --system pytest pytest-benchmark pytest-asyncio apsw pydantic cryptography orjson
        uv pip install --system -e .
    
    - name: Run sync benchmarks (Windows)
      if: runner.os == 'Windows'
      env:
        TEMP: 'D:\temp'
        TMP: 'D:\temp'
      run: |
        pytest tests/test_benchmark.py -v --benchmark-only --benchmark-json=benchmark.json

    - name: Run sync benchmarks (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pytest tests/test_benchmark.py -v --benchmark-only --benchmark-json=benchmark.json
    
    - name: Upload sync benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: benchmark.json
        retention-days: 7

  async-benchmark:
    needs: should-run
    if: needs.should-run.outputs.run_benchmark == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          # Windows: only 3.13
          - os: windows-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Setup Windows temp directory
      if: runner.os == 'Windows'
      shell: powershell
      run: New-Item -ItemType Directory -Force -Path D:\temp

    - name: Install dependencies
      run: |
        uv pip install --system pytest pytest-benchmark pytest-asyncio apsw pydantic cryptography orjson
        uv pip install --system -e .
    
    - name: Run async benchmarks (Windows)
      if: runner.os == 'Windows'
      env:
        TEMP: 'D:\temp'
        TMP: 'D:\temp'
      run: |
        pytest tests/test_async_benchmark.py -v --benchmark-only --benchmark-json=async-benchmark.json

    - name: Run async benchmarks (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pytest tests/test_async_benchmark.py -v --benchmark-only --benchmark-json=async-benchmark.json
    
    - name: Upload async benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: async-benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: async-benchmark.json
        retention-days: 7


  benchmark-summary:
    needs: [should-run, benchmark, async-benchmark, paired-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    
    steps:
    - name: Skip Summary (No relevant changes)
      if: needs.should-run.outputs.run_benchmark != 'true'
      run: |
        echo "## 📊 Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏭️ **Benchmarks skipped** - No source, test or benchmark configuration changes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Benchmarks run for source, tests, dependencies and benchmark configuration changes." >> $GITHUB_STEP_SUMMARY

    - uses: actions/checkout@v7
      if: needs.should-run.outputs.run_benchmark == 'true'
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Fetch gh-pages branch for comparison
      if: needs.should-run.outputs.run_benchmark == 'true'
      run: |
        git fetch origin gh-pages:gh-pages || echo "gh-pages branch not found (first run)"
    
    - name: Download sync benchmark results
      if: needs.should-run.outputs.run_benchmark == 'true'
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: benchmark-results-*
        path: benchmark-results
    
    - name: Download async benchmark results
      if: needs.should-run.outputs.run_benchmark == 'true'
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: async-benchmark-results-*
        path: async-benchmark-results

    
    - name: Set up Python
      if: needs.should-run.outputs.run_benchmark == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Generate Combined Benchmark Summary
      env:
        # Different historical runners cannot establish a paired regression.
        BENCHMARK_COMPARE_PREVIOUS: 'false'
      id: benchmark-results
      if: needs.should-run.outputs.run_benchmark == 'true'
      run: |
        echo "## 📊 Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ⚠️ **Note**: GitHub Actions runners have performance variance. Historical results are informational only. Use the Same-run baseline comparison jobs for change assessment." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔄 Sync Benchmarks (NanaSQLite)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        python3 scripts/parse_benchmark.py benchmark-results sync >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚡ Async Benchmarks (AsyncNanaSQLite)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        python3 scripts/parse_benchmark.py async-benchmark-results async >> $GITHUB_STEP_SUMMARY


    # --- Performance Regression Detection (Only on main branch when benchmarks ran) ---
    - name: Merge all results for comparison
      if: github.ref == 'refs/heads/main' && needs.should-run.outputs.run_benchmark == 'true'
      run: |
        python3 -c "
        import json
        import os
        from pathlib import Path

        combined = {'benchmarks': []}

        # Sync results
        for p in Path('benchmark-results').rglob('benchmark.json'):
            try:
                data = json.load(open(p))
                for entry in data.get('benchmarks', []):
                    entry['name'] = p.parent.name + '::' + entry['name']
                    entry['fullname'] = p.parent.name + '::' + entry.get('fullname', entry['name'])
                    combined['benchmarks'].append(entry)
            except (OSError, ValueError, KeyError) as exc:
                raise RuntimeError(f'Invalid benchmark artifact: {p}') from exc

        # Async results
        for p in Path('async-benchmark-results').rglob('async-benchmark.json'):
            try:
                data = json.load(open(p))
                for entry in data.get('benchmarks', []):
                    entry['name'] = p.parent.name + '::' + entry['name']
                    entry['fullname'] = p.parent.name + '::' + entry.get('fullname', entry['name'])
                    combined['benchmarks'].append(entry)
            except (OSError, ValueError, KeyError) as exc:
                raise RuntimeError(f'Invalid benchmark artifact: {p}') from exc


        # Keep commit provenance; samples are from multiple distinct runners.
        for p in Path('benchmark-results').rglob('benchmark.json'):
            try:
                data = json.load(open(p))
                if 'machine_info' in data:
                    combined['machine_info'] = {'description': 'Multiple runners; see configuration-prefixed benchmark names'}
                    combined['commit_info'] = data.get('commit_info', {})
                    combined['datetime'] = data.get('datetime', '')
                    break
            except (OSError, ValueError, KeyError) as exc:
                raise RuntimeError(f'Invalid benchmark artifact: {p}') from exc

        if not combined['benchmarks']:
            raise RuntimeError('No valid benchmark samples to publish')
        json.dump(combined, open('combined-benchmark.json', 'w'))
        print(f'Combined {len(combined[\"benchmarks\"])} benchmark results')
        "

    - name: Store and Compare Benchmark Result
      if: github.ref == 'refs/heads/main' && needs.should-run.outputs.run_benchmark == 'true'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: NanaSQLite Performance
        tool: 'pytest'
        output-file-path: combined-benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # 120% = 20% slowdown threshold
        alert-threshold: '200%'
        # Historical runner-to-runner alerts are not used for regression decisions.
        comment-on-alert: false
        fail-on-alert: false
        gh-pages-branch: 'gh-pages'
        benchmark-data-dir-path: 'dev/bench'
